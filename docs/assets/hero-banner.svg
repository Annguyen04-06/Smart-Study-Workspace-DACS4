<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Smart Study Workspace — AI &amp; Real-Time Learning Platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0c1535"/>
    </linearGradient>
    <radialGradient id="blobIndigo"><stop offset="0" stop-color="#6366f1" stop-opacity="0.85"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobFuchsia"><stop offset="0" stop-color="#d946ef" stop-opacity="0.6"/><stop offset="1" stop-color="#d946ef" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobCyan"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="0.6" stop-color="#8b5cf6"/><stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="titleGrad" gradientUnits="userSpaceOnUse" x1="240" y1="0" x2="900" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#c7d2fe"/>
      <stop offset="0.55" stop-color="#f0abfc"/>
      <stop offset="0.75" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 660 0; 0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="360" rx="28"/></clipPath>
    <clipPath id="type1"><rect x="242" y="220" height="36" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.1;0.32;0.3333;1" values="0;610;610;0;0"/>
    </rect></clipPath>
    <clipPath id="type2"><rect x="242" y="220" height="36" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.3333;0.4333;0.6533;0.6667;1" values="0;0;625;625;0;0"/>
    </rect></clipPath>
    <clipPath id="type3"><rect x="242" y="220" height="36" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.6667;0.7667;0.9867;1" values="0;0;565;565;0"/>
    </rect></clipPath>
    <style>
      .font { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      .drift-a { animation: driftA 14s ease-in-out infinite alternate; }
      .drift-b { animation: driftB 18s ease-in-out infinite alternate; }
      .drift-c { animation: driftC 16s ease-in-out infinite alternate; }
      @keyframes driftA { from { transform: translate(0, 0); } to { transform: translate(140px, 40px); } }
      @keyframes driftB { from { transform: translate(0, 0); } to { transform: translate(-160px, -30px); } }
      @keyframes driftC { from { transform: translate(0, 0); } to { transform: translate(-80px, 50px); } }
      .float { animation: float 4.5s ease-in-out infinite; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      .twinkle { animation: twinkle 3.2s ease-in-out infinite; }
      @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.95; } }
      .chip { opacity: 0; animation: chipIn 0.7s ease-out forwards; }
      @keyframes chipIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .rise { opacity: 0; animation: chipIn 0.9s ease-out forwards; }
      .scan { animation: scan 5s linear infinite; }
      @keyframes scan { from { transform: translateX(-1200px); } to { transform: translateX(1200px); } }
      .spark { transform-box: fill-box; transform-origin: center; animation: spark 2.4s ease-in-out infinite; }
      @keyframes spark { 0%, 100% { transform: scale(0.8) rotate(0deg); opacity: 0.7; } 50% { transform: scale(1.15) rotate(20deg); opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <g filter="url(#soft)">
      <circle class="drift-a" cx="260" cy="80" r="170" fill="url(#blobIndigo)"/>
      <circle class="drift-b" cx="980" cy="300" r="190" fill="url(#blobFuchsia)"/>
      <circle class="drift-c" cx="760" cy="40" r="150" fill="url(#blobCyan)"/>
    </g>

    <g fill="#e0e7ff">
      <circle class="twinkle" cx="120" cy="300" r="1.8" style="animation-delay:0s"/>
      <circle class="twinkle" cx="1050" cy="60" r="2" style="animation-delay:0.6s"/>
      <circle class="twinkle" cx="980" cy="150" r="1.4" style="animation-delay:1.2s"/>
      <circle class="twinkle" cx="1120" cy="250" r="1.8" style="animation-delay:1.8s"/>
      <circle class="twinkle" cx="640" cy="320" r="1.5" style="animation-delay:0.3s"/>
      <circle class="twinkle" cx="900" cy="230" r="1.2" style="animation-delay:2.2s"/>
      <circle class="twinkle" cx="60" cy="120" r="1.6" style="animation-delay:1.4s"/>
      <circle class="twinkle" cx="1160" cy="130" r="1.3" style="animation-delay:2.6s"/>
      <circle class="twinkle" cx="420" cy="40" r="1.4" style="animation-delay:0.9s"/>
    </g>

    <!-- Logo: mũ tốt nghiệp + tia sáng AI -->
    <g class="float">
      <rect x="92" y="96" width="112" height="112" rx="30" fill="url(#logoGrad)" filter="url(#glow)"/>
      <path d="M148 128 L188 146 L148 164 L108 146 Z" fill="#ffffff"/>
      <path d="M124 154 V174 C124 182 172 182 172 174 V154 L148 165 Z" fill="#e0e7ff"/>
      <path d="M184 148 V170" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="184" cy="173" r="4" fill="#ffffff"/>
      <path class="spark" d="M186 104 L190 114 L200 118 L190 122 L186 132 L182 122 L172 118 L182 114 Z" fill="#fde68a"/>
    </g>

    <g class="font">
      <text class="rise" x="240" y="152" font-size="56" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Smart Study Workspace</text>
      <text class="rise" x="243" y="193" font-size="21" font-weight="600" fill="#cbd5e1" style="animation-delay:0.25s">AI &amp; Real-Time Learning Platform  •  DACS4</text>

      <g font-size="24" font-weight="600" fill="#a5b4fc">
        <text x="243" y="246" clip-path="url(#type1)" textLength="605" lengthAdjust="spacing">Trợ giảng @bot Gemini trả lời dạng stream từng chữ</text>
        <text x="243" y="246" clip-path="url(#type2)" textLength="620" lengthAdjust="spacing">Phòng học nhóm realtime: chat, bảng trắng, Pomodoro</text>
        <text x="243" y="246" clip-path="url(#type3)" textLength="560" lengthAdjust="spacing">PWA cài 1 chạm • chạy ngầm 24/7 • HTTPS mọi nơi</text>
      </g>
      <rect x="246" y="224" width="3" height="28" rx="1.5" fill="#f0abfc">
        <animate attributeName="x" dur="12s" repeatCount="indefinite" keyTimes="0;0.1;0.32;0.3333;0.4333;0.6533;0.6667;0.7667;0.9867;1" values="246;852;852;246;867;867;246;807;807;246"/>
        <animate attributeName="opacity" dur="0.9s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.5;0.55;1"/>
      </rect>

      <g font-size="15" font-weight="700">
        <g class="chip" style="animation-delay:0.5s"><rect x="242" y="276" width="148" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.5"/><text x="316" y="298" text-anchor="middle" fill="#e0e7ff">ASP.NET Core 8</text></g>
        <g class="chip" style="animation-delay:0.65s"><rect x="400" y="276" width="90" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.5"/><text x="445" y="298" text-anchor="middle" fill="#e0e7ff">SignalR</text></g>
        <g class="chip" style="animation-delay:0.8s"><rect x="500" y="276" width="90" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.5"/><text x="545" y="298" text-anchor="middle" fill="#ccfbf1">FastAPI</text></g>
        <g class="chip" style="animation-delay:0.95s"><rect x="600" y="276" width="108" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#f0abfc" stroke-opacity="0.55"/><text x="654" y="298" text-anchor="middle" fill="#fae8ff">Gemini AI</text></g>
        <g class="chip" style="animation-delay:1.1s"><rect x="718" y="276" width="58" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.5"/><text x="747" y="298" text-anchor="middle" fill="#e0e7ff">PWA</text></g>
        <g class="chip" style="animation-delay:1.25s"><rect x="786" y="276" width="116" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.5"/><text x="844" y="298" text-anchor="middle" fill="#e0f2fe">SQL Server</text></g>
      </g>
    </g>

    <rect class="scan" x="0" y="352" width="600" height="3" fill="url(#lineGrad)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="28" fill="none" stroke="#818cf8" stroke-opacity="0.35"/>
</svg>
