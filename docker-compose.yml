services:
  # =============================================================================
  # 1. Cơ sở dữ liệu Microsoft SQL Server 2022
  # =============================================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartstudy-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd!' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd!' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - smartstudy-net

  # =============================================================================
  # 2. Python 3.11 FastAPI AI Microservice (Trích xuất PDF + Google Gemini SDK)
  # =============================================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: smartstudy-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - INTERNAL_API_KEY=smartstudy-internal-secret-key-2026
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    networks:
      - smartstudy-net

  # =============================================================================
  # 3. ASP.NET Core Web API (.NET 8 Clean Architecture + SignalR Hub)
  # =============================================================================
  backend-core:
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    container_name: smartstudy-backend-core
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=SmartStudyWorkspaceDb;User Id=sa;Password=YourStrong@Passw0rd!;TrustServerCertificate=True;MultipleActiveResultSets=True
      - AiMicroservice__BaseUrl=http://ai-service:8000
      - AiMicroservice__InternalApiKey=smartstudy-internal-secret-key-2026
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - backend_uploads:/app/wwwroot/uploads
    networks:
      - smartstudy-net

  # =============================================================================
  # 4. Frontend PWA Nginx Static Host & WebSocket Reverse Proxy
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartstudy-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend-core
    networks:
      - smartstudy-net

volumes:
  mssql_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  smartstudy-net:
    driver: bridge
