# =============================================================================
# Smart Study Workspace — 24/7 Production VPS Stack (5 Containers + Auto HTTPS)
# Chạy bằng lệnh:
#   docker compose -f deploy/vps/docker-compose.prod.yml --env-file deploy/vps/.env.production up -d --build
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Microsoft SQL Server 2022 (Lưu trữ dữ liệu vĩnh viễn qua volume)
  # ---------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartstudy-prod-sqlserver
    restart: unless-stopped
    labels:
      - "autoheal=true"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD:?Thiếu SQL_SA_PASSWORD trong .env.production}
      - MSSQL_PID=Express
      - MSSQL_MEMORY_LIMIT_MB=1024
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - smartstudy-prod-net

  # ---------------------------------------------------------------------------
  # 2. Python 3.11 FastAPI AI Microservice (PDF Extractor + Gemini 2.5 Flash)
  # ---------------------------------------------------------------------------
  ai-service:
    build:
      context: ../../ai-service
      dockerfile: Dockerfile
    container_name: smartstudy-prod-ai
    restart: unless-stopped
    labels:
      - "autoheal=true"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?Thiếu INTERNAL_API_KEY trong .env.production}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - smartstudy-prod-net

  # ---------------------------------------------------------------------------
  # 3. ASP.NET Core .NET 8 All-in-One Host (API + SignalR + Frontend PWA + Uploads)
  # ---------------------------------------------------------------------------
  backend-core:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.backend-allinone
    container_name: smartstudy-prod-backend
    restart: unless-stopped
    labels:
      - "autoheal=true"
    depends_on:
      sqlserver:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - FrontendHosting__RootPath=/app/frontend
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=SmartStudyWorkspaceDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True
      - JwtSettings__SecretKey=${JWT_SECRET:?Thiếu JWT_SECRET trong .env.production}
      - JwtSettings__Issuer=SmartStudyWorkspace.Backend
      - JwtSettings__Audience=SmartStudyWorkspace.Client
      - JwtSettings__ExpiryMinutes=1440
      - AiMicroservice__BaseUrl=http://ai-service:8000
      - AiMicroservice__InternalApiKey=${INTERNAL_API_KEY}
      - AiMicroservice__TimeoutSeconds=90
      - GoogleSmtp__SenderEmail=${GOOGLE_SMTP_EMAIL:-}
      - GoogleSmtp__AppPassword=${GOOGLE_SMTP_APP_PASSWORD:-}
    volumes:
      - backend_uploads:/app/wwwroot/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/health"]
      interval: 25s
      timeout: 5s
      retries: 4
      start_period: 25s
    networks:
      - smartstudy-prod-net

  # ---------------------------------------------------------------------------
  # 4. Caddy Reverse Proxy (Tự động cấp & gia hạn SSL HTTPS Let's Encrypt 100%)
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: smartstudy-prod-caddy
    restart: unless-stopped
    depends_on:
      backend-core:
        condition: service_healthy
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - smartstudy-prod-net

  # ---------------------------------------------------------------------------
  # 5. Autoheal Watchdog (Tự động khởi động lại mọi container bị unhealthy 24/7)
  # ---------------------------------------------------------------------------
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: smartstudy-prod-autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=45
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - smartstudy-prod-net

volumes:
  sqlserver_data:
    driver: local
  backend_uploads:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  smartstudy-prod-net:
    driver: bridge
