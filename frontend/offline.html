<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mất kết nối Internet — Smart Study Workspace</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="theme-color" content="#4f46e5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SmartStudy">
    <link rel="apple-touch-icon" href="./src/assets/icons/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="./src/assets/icons/icon.svg">
    <link rel="stylesheet" href="./src/assets/styles/animations.css">
    <link rel="stylesheet" href="./src/assets/styles/mobile-native.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca'
                        }
                    }
                }
            }
        };
    </script>
</head>
<body class="safe-area-shell bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden select-none">
    <!-- Aurora background mesh -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative z-10 max-w-md w-full text-center bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 shadow-2xl">
        <!-- Disconnected Wifi Icon with pulsing aura -->
        <div class="w-20 h-20 mx-auto mb-6 rounded-2xl bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-indigo-400 relative">
            <div class="absolute inset-0 rounded-2xl bg-indigo-500/20 animate-ping opacity-30"></div>
            <svg class="w-10 h-10 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 0a5 5 0 010-7.072M3 3l18 18M12 18h.01M8.464 15.536a5 5 0 00-1.414-1.414M5.636 18.364a9 9 0 010-12.728" />
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-white mb-2 tracking-tight">Mất kết nối Internet</h1>
        <p class="text-sm text-slate-400 mb-6 leading-relaxed">
            Bạn hiện đang ở chế độ ngoại tuyến. Hãy kiểm tra đường truyền Wi-Fi hoặc dữ liệu di động để tiếp tục học nhóm và tương tác cùng Trợ giảng AI.
        </p>

        <div class="space-y-3">
            <button onclick="window.location.reload()" 
                    class="w-full py-3 px-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium rounded-xl shadow-lg shadow-indigo-500/25 transition-all duration-200 flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                <span>Thử kết nối lại</span>
            </button>
            <a href="./index.html" 
               class="block w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium rounded-xl border border-slate-700/60 transition-colors">
                Quay lại Trang chủ (Bộ nhớ đệm)
            </a>
        </div>

        <div class="mt-6 pt-4 border-t border-slate-800/80 text-xs text-slate-500 flex items-center justify-center gap-2">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
            <span>Smart Study Workspace PWA Offline Shell</span>
        </div>
    </div>
</body>
</html>
