<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Không gian Phòng học — Smart Study Workspace</title>
    <!-- PWA & Mobile Optimization -->
    <link rel="manifest" href="../../manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmartStudy" />
    <link rel="apple-touch-icon" href="../../src/assets/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="../../src/assets/icons/icon.svg" />
    <link rel="alternate icon" type="image/png" href="../../src/assets/icons/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <link rel="stylesheet" href="../../src/assets/styles/variables.css" />
    <link rel="stylesheet" href="../../src/assets/styles/components.css" />
    <link rel="stylesheet" href="../../src/assets/styles/animations.css" />
    <link rel="stylesheet" href="../../src/assets/styles/mobile-native.css" />
</head>
<body class="relative min-h-screen overflow-x-hidden mesh-light-hero dark:bg-slate-950 text-slate-900 dark:text-slate-100">
    <!-- Lớp nền Cực quang Aurora Mesh chuyển động chậm tinh tế cho cả Light & Dark Mode -->
    <div class="pointer-events-none fixed inset-0 overflow-hidden -z-10" aria-hidden="true">
        <div class="aurora-orb-a absolute -top-28 left-1/4 h-96 w-96 rounded-full bg-indigo-500/[0.11] dark:bg-indigo-500/[0.16] blur-3xl"></div>
        <div class="aurora-orb-b absolute top-40 right-12 h-80 w-80 rounded-full bg-fuchsia-500/[0.08] dark:bg-violet-500/[0.14] blur-3xl"></div>
        <div class="aurora-orb-a absolute bottom-8 left-12 h-72 w-72 rounded-full bg-cyan-400/[0.08] dark:bg-emerald-400/[0.10] blur-3xl"></div>
    </div>

    <div id="app-navbar"></div>

    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
        <!-- Hero Banner Aurora Mesh & Glassmorphism sang trọng + Nhập nhanh mã mời InviteCode -->
        <div class="spotlight-surface relative overflow-hidden rounded-3xl mesh-dark-surface p-6 sm:p-8 text-white shadow-xl border border-white/10">
            <div class="pointer-events-none absolute -top-20 -right-16 h-72 w-72 rounded-full bg-indigo-500/30 blur-3xl aurora-orb-a"></div>
            <div class="pointer-events-none absolute -bottom-24 left-1/3 h-64 w-64 rounded-full bg-fuchsia-500/20 blur-3xl aurora-orb-b"></div>
            <div class="relative z-10 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-6">
                <div>
                    <span class="inline-flex items-center gap-1.5 rounded-full bg-white/10 border border-white/15 px-3 py-1 text-[11px] font-semibold text-indigo-200">
                        <span class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span>
                        <span>Realtime Study Workspace</span>
                    </span>
                    <h1 class="mt-3 text-2xl sm:text-3xl font-extrabold tracking-tight">
                        Chào mừng trở lại, <span id="dashboard-welcome-name" class="text-indigo-300">Sinh viên</span>!
                    </h1>
                    <p class="mt-2 text-sm text-slate-300 max-w-2xl leading-relaxed">
                        Vào phòng học để trao đổi thời gian thực cùng bạn bè, hỏi đáp ngữ cảnh học liệu PDF với <code class="rounded bg-white/15 px-1.5 py-0.5 font-mono text-xs text-indigo-200">@bot</code>, làm đề trắc nghiệm và lật thẻ 3D.
                    </p>
                </div>

                <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                    <form id="quick-join-code-form" class="flex items-center rounded-2xl bg-white/10 p-1.5 backdrop-blur-md border border-white/15">
                        <input id="quick-invite-code-input" type="text" maxlength="20" placeholder="Mã mời (VD: OS209, SEC308)"
                            class="w-48 bg-transparent px-3 py-2 text-xs font-mono uppercase text-white placeholder-slate-400 focus:outline-none" />
                        <button type="submit" class="rounded-xl bg-white px-3.5 py-2 text-xs font-bold text-slate-900 hover:bg-indigo-50 transition">
                            Vào bằng Mã
                        </button>
                    </form>

                    <button id="btn-open-create-room" type="button"
                        class="btn-primary-glow inline-flex items-center justify-center gap-2 rounded-2xl px-5 py-3 text-xs font-bold">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.3"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                        <span>Tạo Phòng học Mới</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Thanh công cụ Tìm kiếm & Lọc chuyên ngành -->
        <div class="mt-7 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div class="flex flex-wrap items-center gap-3">
                <div class="inline-flex rounded-xl bg-slate-200/75 p-1">
                    <button type="button" data-scope-tab="all" class="rounded-lg bg-white px-3.5 py-1.5 text-xs font-semibold text-indigo-700 shadow-sm">
                        Tất cả phòng mở
                    </button>
                    <button type="button" data-scope-tab="joined" class="rounded-lg px-3.5 py-1.5 text-xs font-medium text-slate-600 hover:text-slate-900 transition">
                        Phòng của tôi
                    </button>
                </div>

                <select id="room-subject-filter"
                    class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-3.5 py-2 text-xs font-semibold text-slate-700 dark:text-slate-200 shadow-xs focus:border-indigo-500 focus:outline-none">
                    <option value="">Tất cả môn học VKU</option>
                    <option value="Lập trình Mạng">Lập trình Mạng</option>
                    <option value="Cấu trúc dữ liệu">Cấu trúc dữ liệu</option>
                    <option value="Trí tuệ nhân tạo">Trí tuệ nhân tạo</option>
                    <option value="Cơ sở dữ liệu">Cơ sở dữ liệu</option>
                    <option value="Toán rời rạc">Toán rời rạc</option>
                    <option value="Hệ điều hành">Hệ điều hành</option>
                    <option value="Phát triển Web">Phát triển Web</option>
                    <option value="An toàn thông tin">An toàn thông tin</option>
                    <option value="Điện toán đám mây">Điện toán đám mây</option>
                    <option value="Công nghệ phần mềm">Công nghệ phần mềm</option>
                    <option value="Lập trình Di động">Lập trình Di động</option>
                    <option value="Học sâu &amp; Thị giác máy">Học sâu &amp; Thị giác máy</option>
                    <option value="Khoa học Dữ liệu">Khoa học Dữ liệu</option>
                    <option value="Kiểm thử phần mềm">Kiểm thử phần mềm</option>
                    <option value="Đồ án Chuyên ngành">Đồ án Chuyên ngành</option>
                    <option value="Hệ thống IoT">Hệ thống IoT</option>
                </select>
            </div>

            <div class="flex items-center gap-3">
                <span id="rooms-count-summary" class="hidden sm:inline text-xs font-medium text-slate-500"></span>
                <div class="relative flex-1 sm:w-72">
                    <svg class="pointer-events-none absolute left-3.5 top-2.5 h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <input id="room-search-input" type="search" placeholder="Tìm tên phòng, môn học, mã mời..."
                        class="w-full rounded-xl border border-slate-200 bg-white pl-9 pr-3.5 py-2 text-xs text-slate-900 shadow-xs placeholder-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-4 focus:ring-indigo-500/10" />
                </div>
            </div>
        </div>

        <!-- Danh sách thẻ phòng học -->
        <div id="rooms-grid" class="mt-6 grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>
    </main>

    <!-- Modal Tạo Phòng Học Nhóm Mới -->
    <div id="create-room-modal" class="ss-modal-backdrop hidden" role="dialog" aria-modal="true">
        <div class="saas-card w-full max-w-lg p-6 shadow-2xl animate-slide-fade">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3.5">
                <h2 class="text-base font-extrabold text-slate-900">Khởi tạo Phòng học Nhóm mới</h2>
                <button type="button" data-modal-close class="rounded-lg p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-700">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <form id="create-room-form" class="mt-4 space-y-4">
                <div>
                    <label for="create-room-name" class="block text-xs font-semibold uppercase tracking-wide text-slate-700 mb-1.5">Tên phòng học</label>
                    <input id="create-room-name" type="text" required maxlength="150"
                        placeholder="VD: Ôn thi Cơ sở Dữ liệu Phân tán K2024"
                        class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:border-indigo-500 focus:outline-none focus:ring-4 focus:ring-indigo-500/10" />
                </div>

                <div>
                    <label for="create-room-subject" class="block text-xs font-semibold uppercase tracking-wide text-slate-700 mb-1.5">Chuyên ngành / Môn học</label>
                    <select id="create-room-subject" required
                        class="w-full rounded-xl border border-slate-300 bg-white px-3.5 py-2.5 text-sm focus:border-indigo-500 focus:outline-none">
                        <option value="Lập trình Mạng">Lập trình Mạng</option>
                        <option value="Cấu trúc dữ liệu">Cấu trúc dữ liệu</option>
                        <option value="Trí tuệ nhân tạo">Trí tuệ nhân tạo</option>
                        <option value="Cơ sở dữ liệu">Cơ sở dữ liệu</option>
                        <option value="Toán rời rạc">Toán rời rạc</option>
                        <option value="Hệ điều hành">Hệ điều hành</option>
                        <option value="Phát triển Web">Phát triển Web</option>
                        <option value="An toàn thông tin">An toàn thông tin</option>
                        <option value="Điện toán đám mây">Điện toán đám mây</option>
                        <option value="Công nghệ phần mềm">Công nghệ phần mềm</option>
                        <option value="Lập trình Di động">Lập trình Di động</option>
                        <option value="Học sâu &amp; Thị giác máy">Học sâu &amp; Thị giác máy</option>
                        <option value="Khoa học Dữ liệu">Khoa học Dữ liệu</option>
                        <option value="Kiểm thử phần mềm">Kiểm thử phần mềm</option>
                        <option value="Đồ án Chuyên ngành">Đồ án Chuyên ngành</option>
                        <option value="Hệ thống IoT">Hệ thống IoT</option>
                    </select>
                </div>

                <div>
                    <label for="create-room-desc" class="block text-xs font-semibold uppercase tracking-wide text-slate-700 mb-1.5">Mô tả mục tiêu học tập</label>
                    <textarea id="create-room-desc" rows="3" maxlength="500"
                        placeholder="Mô tả ngắn gọn nội dung ôn tập, lịch thảo luận nhóm..."
                        class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:border-indigo-500 focus:outline-none focus:ring-4 focus:ring-indigo-500/10"></textarea>
                </div>

                <div class="flex items-center justify-end gap-2.5 pt-2">
                    <button type="button" data-modal-close class="rounded-xl border border-slate-200 px-4 py-2.5 text-xs font-semibold text-slate-600 hover:bg-slate-50">
                        Hủy bỏ
                    </button>
                    <button id="create-room-submit-btn" type="submit" class="btn-primary-glow rounded-xl px-5 py-2.5 text-xs font-semibold">
                        Tạo phòng &amp; Mở Workspace
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../../src/features/dashboard/dashboard.controller.js"></script>
</body>
</html>
