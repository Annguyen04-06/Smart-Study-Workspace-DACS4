server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Nén Gzip tối ưu truyền tải file tĩnh
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/manifest+json application/xml+rss application/atom+xml image/svg+xml;

    # Cấu hình MIME type chuẩn cho ES6 modules và PWA
    include /etc/nginx/mime.types;
    types {
        application/javascript js mjs;
        application/manifest+json webmanifest;
    }

    # Endpoint kiểm tra sức khỏe của Nginx
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    # Proxy các cuộc gọi REST API tới Backend Core .NET 8
    location /api/ {
        proxy_pass http://backend-core:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Proxy kết nối SignalR Hub qua WebSockets hai chiều thời gian thực
    location /hubs/ {
        proxy_pass http://backend-core:5000/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Proxy tải file PDF tài liệu và avatar từ Backend static storage
    location /uploads/ {
        proxy_pass http://backend-core:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Tuyệt đối không cache Service Worker để trình duyệt luôn nhận bản cập nhật mới
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Tuyệt đối không cache Web Manifest
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Điều hướng trang tĩnh
    location / {
        try_files $uri $uri/ /index.html;
    }
}
